<div class="card">
  <h2>Processing requests</h2>

  <div>
    <input [(ngModel)]="filters.reference" placeholder="Reference">
    <input [(ngModel)]="filters.project_id" placeholder="Project id">
    <select [(ngModel)]="filters.status">
      <option value="">All</option>
      <option value="pending">pending</option>
      <option value="processing">processing</option>
      <option value="completed">completed</option>
      <option value="failed">failed</option>
    </select>
    <button (click)="load()">Filter</button>
  </div>

  <table class="table" *ngIf="rows.length">
    <thead>
      <tr>
        <th>ID</th>
        <th>Reference</th>
        <th>Project</th>
        <th>Status</th>
        <th>Created</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of rows">
        <td><a [routerLink]="['/requests', row.id]">{{ row.id }}</a></td>
        <td>{{ row.reference }}</td>
        <td>{{ row.project?.name }}</td>
        <td>{{ row.status }}</td>
        <td>{{ row.created_at }}</td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!rows.length">No rows</p>
</div>
