<div class="container">
  <h2>Dashboard</h2>
 
  @if (isLoading()) {
    <p>Loading...</p>
  } @else {
    @if (stats) {
       <button (click)="load()">Refresh</button>
      <pre>{{ stats | json }}</pre>
      <p>{{ stats?.total }}</p>
    } @else {
      <p>Error loading stats</p>
    }
  }
</div>
